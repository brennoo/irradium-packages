name: Vulnerability Scan

on:
  push:
    branches:
      - "[0-9]*.[0-9]*"
    paths:
      - "packages/**"
      - "ports/**"
      - "builder/**"
      - ".github/workflows/vuln-scan.yml"
  pull_request:
    branches:
      - "[0-9]*.[0-9]*"
    paths:
      - "packages/**"
      - "ports/**"
      - "builder/**"
      - ".github/workflows/vuln-scan.yml"
  workflow_run:
    workflows: ["Sync Upstream"]
    types: [completed]
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      open_issues:
        description: "Open deduplicated GitHub issues for actionable findings and override drift/retire PRs"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scan:
    name: Vulnerability Scan & Override Status
    runs-on: ubuntu-latest
    env:
      DISTR_VERSION: ${{ github.base_ref || github.ref_name }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Lint CPE map and coverage (offline)
        run: |
          PYTHONPATH=./builder python3 -m vulntool cpe lint --all
          PYTHONPATH=./builder python3 -m vulntool cpe coverage --all

      - name: Lint OpenVEX statements
        run: |
          PYTHONPATH=./builder python3 -m vulntool vex lint

      - name: Verify changed CPE map rows against NVD dictionary
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi
          if [[ -n "$BASE_REF" && "$BASE_REF" != "0000000000000000000000000000000000000000" ]]; then
            if git diff --name-only "$BASE_REF"..HEAD -- builder/cpe-map.tsv | grep -q "cpe-map.tsv"; then
              PYTHONPATH=./builder python3 -m vulntool cpe verify --diff "$BASE_REF"
            else
              echo "builder/cpe-map.tsv unchanged; skipping live NVD API verification."
            fi
          fi

      - name: Install Grype
        run: |
          if ! command -v grype >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          fi
          grype version

      - name: Run vulnerability scan on published mirror packages (--fail-on high)
        id: vuln_scan
        env:
          OPEN_ISSUES: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.open_issues == true }}
        run: |
          SCAN_ARGS=(
            --fail-on high
            --report-json /tmp/vuln-report.json
            --sbom-out /tmp/irradium-sbom.cdx.json
            --vex-out /tmp/irradium-openvex.json
            --summary-markdown "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$OPEN_ISSUES" == "true" ]]; then
            SCAN_ARGS+=(--open-issues)
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
            mapfile -t PR_PKGS < <(
              git diff --name-only "$BASE_REF"..HEAD -- ports/custom/ builder/vex/ \
                | awk -F/ '
                    $1=="ports" && $2=="custom" && NF>=4 && $4!="" && $4!="REPO" && $4!~ /^\./ { print $4 }
                    $1=="builder" && $2=="vex" && $3~ /\.json$/ { sub(/\.json$/, "", $3); print $3 }
                  ' \
                | sort -u
            )
            if (( ${#PR_PKGS[@]} > 0 )); then
              echo "==> Scoping PR vulnerability scan to modified package(s): ${PR_PKGS[*]}"
              SCAN_ARGS+=("${PR_PKGS[@]}")
            fi
          fi
          PYTHONPATH=./builder python3 -m vulntool scan "${SCAN_ARGS[@]}"

      - name: Upload vulnerability scan report & SBOM/OpenVEX artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vuln-scan-report
          path: |
            /tmp/vuln-report.json
            /tmp/irradium-sbom.cdx.json
            /tmp/irradium-openvex.json
          if-no-files-found: ignore

      - name: Build vulnerability badge JSON
        if: always()
        run: |
          if [[ -f /tmp/vuln-report.json ]]; then
            jq -c '
              [.actionable[].severity | ascii_downcase] as $s
              | ($s | map(select(. == "critical")) | length) as $crit
              | {
                  schemaVersion: 1,
                  label: "critical",
                  message: ($crit | tostring),
                  color: (if $crit > 0 then "red" else "green" end)
                }' /tmp/vuln-report.json > /tmp/vuln-badge-critical.json
            jq -c '
              [.actionable[].severity | ascii_downcase] as $s
              | ($s | map(select(. == "high")) | length) as $high
              | {
                  schemaVersion: 1,
                  label: "high",
                  message: ($high | tostring),
                  color: (if $high > 0 then "orange" else "green" end)
                }' /tmp/vuln-report.json > /tmp/vuln-badge-high.json
            jq -c '
              [.actionable[].severity | ascii_downcase] as $s
              | ($s | map(select(. == "medium")) | length) as $med
              | {
                  schemaVersion: 1,
                  label: "medium",
                  message: ($med | tostring),
                  color: (if $med > 0 then "yellow" else "green" end)
                }' /tmp/vuln-report.json > /tmp/vuln-badge-medium.json
            jq -c '
              [.actionable[].severity | ascii_downcase] as $s
              | ($s | map(select(. == "low")) | length) as $low
              | {
                  schemaVersion: 1,
                  label: "low",
                  message: ($low | tostring),
                  color: (if $low > 0 then "blue" else "green" end)
                }' /tmp/vuln-report.json > /tmp/vuln-badge-low.json
          fi

      - name: Publish badge JSON to badges branch
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/vuln-badge-critical.json || ! -f /tmp/vuln-badge-high.json || ! -f /tmp/vuln-badge-medium.json || ! -f /tmp/vuln-badge-low.json ]]; then
            echo "No badge JSON produced; skipping publish."
            exit 0
          fi
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin badges 2>/dev/null; then
            git checkout -q -B badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          cp /tmp/vuln-badge-critical.json vuln-critical.json
          cp /tmp/vuln-badge-high.json vuln-high.json
          cp /tmp/vuln-badge-medium.json vuln-medium.json
          cp /tmp/vuln-badge-low.json vuln-low.json
          git add vuln-critical.json vuln-high.json vuln-medium.json vuln-low.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: update vulnerability badges" || { echo "No badge changes."; exit 0; }
          git push -q origin HEAD:badges

      - name: Check custom port override status (retire / drift / stale)
        if: always()
        env:
          APPLY_GITHUB: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.open_issues == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATUS_ARGS=()
          if [[ "$APPLY_GITHUB" == "true" ]]; then
            STATUS_ARGS+=(--apply-github)
          fi
          PYTHONPATH=./builder python3 -m vulntool override status "${STATUS_ARGS[@]}"
